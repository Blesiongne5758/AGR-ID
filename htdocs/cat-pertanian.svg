  <path d="M66 45 C 75 40, 81 47, 77 54 C 72 58, 66 54, 66 45 Z" fill="#c8963e" stroke="#b08030" stroke-width="1.5"/>
  <path d="M58 56 C 67 52, 72 59, 68 66 C 63 70, 58 66, 58 56 Z" fill="#c8963e" stroke="#b08030" stroke-width="1.5"/>
  <path d="M51 68 C 60 64, 65 71, 61 78 C 56 81, 51 77, 51 68 Z" fill="#c8963e" stroke="#b08030" stroke-width="1.5"/>

