# ============================================================
# AGR.ID — deploy.yml : Auto Deploy ke InfinityFree (FTP)
# ============================================================
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - "htdocs/**"
      - ".htaccess-deploy**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🚀 Deploy htdocs → InfinityFree
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout kode terbaru
        uses: actions/checkout@v5

      - name: Siapkan PHP untuk validasi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          php -v | head -1

      - name: Validasi sintaks seluruh file PHP
        working-directory: htdocs
        run: |
          fail=0
          for f in $(find . -maxdepth 1 -name "*.php"); do
            php -l "$f" || fail=1
          done
          [ "$fail" -eq 0 ] && echo "✅ Semua file PHP valid" || { echo "❌ Ada syntax error"; exit 1; }

      - name: Sanity check aset frontend
        working-directory: htdocs
        run: |
          for f in index.html app.js style.css data-master.js api.php; do
            test -f "$f" || { echo "❌ File wajib hilang: $f"; exit 1; }
          done
          grep -q "api.php" app.js && echo "✅ Frontend menunjuk gateway api.php"
          echo "📦 Ukuran paket deploy:" && du -sh .

      - name: Siapkan config.php dari GitHub Secrets
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AGR_ID_SESSION_SECRET: ${{ secrets.AGR_ID_SESSION_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AGR_ID_API_URL: ${{ secrets.AGR_ID_API_URL }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY belum diset di GitHub Secrets"; exit 1; }
          test "${#AGR_ID_SESSION_SECRET}" -ge 64 || { echo "AGR_ID_SESSION_SECRET harus berisi minimal 64 karakter di GitHub Secrets"; exit 1; }
          php -r '
          $config = [
            "supabase_url" => "https://sxcahpbmderuwfvoxkix.supabase.co",
            "supabase_key" => getenv("SUPABASE_ANON_KEY"),
            "cloudinary_cloud" => getenv("CLOUDINARY_CLOUD_NAME") ?: "",
            "cloudinary_key" => getenv("CLOUDINARY_API_KEY") ?: "",
            "cloudinary_secret" => getenv("CLOUDINARY_API_SECRET") ?: "",
            "flask_url" => getenv("AGR_ID_API_URL") ?: "",
            "session_secret" => getenv("AGR_ID_SESSION_SECRET"),
          ];
          file_put_contents("htdocs/config.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Sync file ke InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.example.php
            **/*.sql
            **/DEPLOY-INFINITYFREE.md
            **/*.log
          log-level: standard
          timeout: 120000

      - name: Health check setelah deploy
        if: vars.SITE_DOMAIN != ''
        continue-on-error: true
        run: |
          URL="https://${{ vars.SITE_DOMAIN }}/index.html"
          API="https://${{ vars.SITE_DOMAIN }}/api.php?action=health"
          echo "Cek homepage : $URL"
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "$URL"
          echo "Cek gateway  : $API"
          curl -sS -m 30 "$API" || echo "⚠️ Health gagal"

      - name: Ringkasan hasil deploy
        if: always()
        run: |
          {
            echo "## 🌾 AGR.ID — Deploy InfinityFree"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME}) |"
            echo "| Sumber | \`htdocs/\` → \`/htdocs/\` (docroot) |"
            echo "| Job | $([ "${{ job.status }}" = 'success' ] && echo '✅ Berhasil' || echo '❌ Gagal') |"
          } >> "$GITHUB_STEP_SUMMARY"
