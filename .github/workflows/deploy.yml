# ============================================================
# AGR.ID — deploy.yml : Auto Deploy ke InfinityFree (FTP)
# ============================================================
# Target   : docroot /htdocs/ di infinityfree.com
# Sumber   : folder ./htdocs/ pada repo (SPA statis + api.php)
#
# PRASYARAT (satu kali):
# 1. Buat akun & website di https://infinityfree.com, catat FTP
#    details dari Member Area -> Account -> FTP Details:
#      FTP Server   : ftpupload.net (atau epXX.pro.hosting..., lihat panel)
#      FTP Username : idXXXXXXX_agrid (format: user_site)
#      FTP Password : password FTP (bisa disamakan dgn password member)
# 2. GitHub repo -> Settings -> Secrets and variables -> Actions
#    -> New repository secret, buat:
#        FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#    -> (Opsional) tab "Variables" buat SITE_DOMAIN berisi domain
#        Anda, mis. agrid.infinityfreeapp.com atau custom domain.
# 3. Upload manual SATU KALI via File Manager InfinityFree:
#      htdocs/config.php  (salin dari config.example.php lalu isi
#                          kredensial Supabase & Cloudinary)
#    File ini DIKECUALIKAN dari sync otomatis agar tidak tertimpa/
#    terekspos lewat repo publik.
# 4. Push ke branch main -> deploy berjalan otomatis.
#
# Catatan InfinityFree:
# - Folder uploads global dibersihkan tiap 30 hari; karena itu
#   media disimpan di Cloudinary, bukan filesystem hosting.
# - Rate limit FTP ada; action sudah pakai retry bawaan.
# ============================================================
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
    paths:            # hemat kuota: hanya jalan bila ada perubahan nyata
      - "htdocs/**"
      - ".htaccess-deploy**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}   # tombol jalankan manual di tab Actions

# Jangan jalankan 2 deploy bersamaan di server yang sama
concurrency:
  group: infinityfree-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🚀 Deploy htdocs → InfinityFree
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout kode terbaru
        uses: actions/checkout@v4

      - name: Siapkan PHP untuk validasi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          php -v | head -1

      - name: Validasi sintaks seluruh file PHP
        working-directory: htdocs
        run: |
          fail=0
          for f in $(find . -maxdepth 1 -name "*.php"); do
            php -l "$f" || fail=1
          done
          [ "$fail" -eq 0 ] && echo "✅ Semua file PHP valid" || { echo "❌ Ada syntax error"; exit 1; }

      - name: Sanity check aset frontend
        working-directory: htdocs
        run: |
          for f in index.html app.js style.css data-master.js api.php; do
            test -f "$f" || { echo "❌ File wajib hilang: $f"; exit 1; }
          done
          grep -q "api.php" app.js && echo "✅ Frontend menunjuk gateway api.php"
          echo "📦 Ukuran paket deploy:" && du -sh .

      - name: Sync file ke InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/          # docroot default InfinityFree
          local-dir: ./htdocs/          # HANYA folder htdocs yang di-sync
          exclude: |                    # jangan pernah upload/hapus hal sensitif
            **/.git*
            **/.git*/**
            **/config.php               # kredensial diisi manual di server
            **/config.example.php       # template saja, tak perlu online
            **/*.sql                    # skema/seed dijalankan di Supabase
            **/DEPLOY-INFINITYFREE.md
            **/*.log
          log-level: standard
          timeout: 120000

      - name: Health check setelah deploy
        if: vars.SITE_DOMAIN != ''
        continue-on-error: true
        run: |
          URL="https://${{ vars.SITE_DOMAIN }}/index.html"
          API="https://${{ vars.SITE_DOMAIN }}/api.php?action=health"
          echo "Cek homepage : $URL"
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "$URL"
          echo "Cek gateway  : $API"
          curl -sS -m 30 "$API" || echo "⚠️ Health gagal — normal bila config.php belum diisi"

      - name: Ringkasan hasil deploy
        if: always()
        run: |
          {
            echo "## 🌾 AGR.ID — Deploy InfinityFree"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME}) |"
            echo "| Sumber | \`htdocs/\` → \`/htdocs/\` (docroot) |"
            echo "| Job | $([ \"${{ job.status }}\" = 'success' ] && echo '✅ Berhasil' || echo '❌ Gagal') |"
            echo ""
            echo "> Bila baru pertama kali: upload \`config.php\` via File Manager,"
            echo "> lalu jalankan ulang workflow ini."
          } >> "$GITHUB_STEP_SUMMARY"
