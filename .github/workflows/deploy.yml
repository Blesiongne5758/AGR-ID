# ============================================================
# AGR.ID — deploy.yml : Auto Deploy ke InfinityFree (FTP)
# ============================================================
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - "htdocs/**"
      - ".htaccess-deploy**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🚀 Deploy htdocs → InfinityFree
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout kode terbaru
        uses: actions/checkout@v5

      - name: Siapkan PHP untuk validasi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          php -v | head -1

      - name: Validasi sintaks seluruh file PHP
        working-directory: htdocs
        run: |
          fail=0
          for f in $(find . -maxdepth 1 -name "*.php"); do
            php -l "$f" || fail=1
          done
          [ "$fail" -eq 0 ] && echo "✅ Semua file PHP valid" || { echo "❌ Ada syntax error"; exit 1; }

      - name: Sanity check aset frontend
        working-directory: htdocs
        run: |
          for f in index.html app.js style.css data-master.js api.php; do
            test -f "$f" || { echo "❌ File wajib hilang: $f"; exit 1; }
          done
          grep -q "api.php" app.js && echo "✅ Frontend menunjuk gateway api.php"
          echo "📦 Ukuran paket deploy:" && du -sh .

      - name: Siapkan config.php untuk InfinityFree
        run: |
          cat << 'EOF' > htdocs/config.php
          <?php
          return [
              'supabase_url'    => 'https://sxcahpbmderuwfvoxkix.supabase.co',
              'supabase_key'    => 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4Y2FocGJtZGVydXdmdm94a2l4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjUyMzAyNSwiZXhwIjoyMTA4MDk5MDI1fQ.pmLbLWTz_0NC8K_zUT9LqSRArhcoguXIoPi1NNVDUl4',
              'cloudinary_cloud'   => '',
              'cloudinary_key'     => '',
              'cloudinary_secret'  => '',
              'flask_url'       => '',
              'session_secret'  => 'Jsu6Ye-9l2AQLPO94eSUtQ-znCOWJioxfogPXU-4ac7f87d-aca4-48e0-8fde-b9b7c55d66e2',
          ];
          EOF

      - name: Sync file ke InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.example.php
            **/*.sql
            **/DEPLOY-INFINITYFREE.md
            **/*.log
          log-level: standard
          timeout: 120000

      - name: Health check setelah deploy
        if: vars.SITE_DOMAIN != ''
        continue-on-error: true
        run: |
          URL="https://${{ vars.SITE_DOMAIN }}/index.html"
          API="https://${{ vars.SITE_DOMAIN }}/api.php?action=health"
          echo "Cek homepage : $URL"
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "$URL"
          echo "Cek gateway  : $API"
          curl -sS -m 30 "$API" || echo "⚠️ Health gagal"

      - name: Ringkasan hasil deploy
        if: always()
        run: |
          {
            echo "## 🌾 AGR.ID — Deploy InfinityFree"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME}) |"
            echo "| Sumber | \`htdocs/\` → \`/htdocs/\` (docroot) |"
            echo "| Job | $([ "${{ job.status }}" = 'success' ] && echo '✅ Berhasil' || echo '❌ Gagal') |"
          } >> "$GITHUB_STEP_SUMMARY"
