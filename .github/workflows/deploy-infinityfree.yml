# ============================================================
# AGR.ID — Auto Deploy ke InfinityFree via FTP
# ============================================================
# Cara pakai:
# 1. Buat akun/website di infinityfree.com, catat data FTP dari
#    Area Member (Accounts -> FTP Details):
#      - FTP Server   : contoh ftpupload.net atau ep2.prohosting...
#      - FTP Username : contoh idr_34567890
#      - FTP Password : password akun member Anda
# 2. Di GitHub repo: Settings -> Secrets and variables -> Actions
#    -> New repository secret, buat 3 secrets:
#      FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# 3. Push workflow ini + kode ke branch main -> deploy otomatis jalan.
#
# Catatan: server-dir /htdocs/ adalah docroot default InfinityFree.
# ============================================================
name: Deploy to InfinityFree

on:
  push:
    branches:
      - main        # sesuaikan bila branch utama Anda "master"
  workflow_dispatch: # tombol jalankan manual di tab Actions

jobs:
  web-deploy:
    name: Deploy htdocs ke InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Validate PHP gateway syntax
        run: php -l htdocs/api.php

      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/            # docroot InfinityFree
          local-dir: ./htdocs/            # hanya folder htdocs yang di-sync
          exclude: |                      # jangan pernah upload secret/config lokal
            **/.git*
            **/.git*/**
            **/config.php                 # kredensial Supabase/Cloudinary diisi manual di server
            **/*.log
          log-level: verbose

      - name: Health check setelah deploy
        continue-on-error: true
        run: |
          sleep 10
          URL="https://${{ vars.SITE_DOMAIN }}/api.php?action=health"
          echo "Cek: $URL"
          curl -sS -m 30 "$URL" || echo "Health check gagal (normal jika config.php belum diisi)"
