<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" fill="none">
  <!-- Subtle Watermark Background representing 4 Core Sectors of AGR-ID:
       Pertanian (Agriculture), Perkebunan (Plantation), Perikanan (Fisheries), Peternakan (Livestock) -->
  <defs>
    <linearGradient id="fadeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#c8963e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2b6cb0" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <g opacity="0.075" stroke-linecap="round" stroke-linejoin="round">
    <!-- BACKGROUND LANDSCAPE & CONTOURS (Sawah Berundak & Bukit) -->
    <path d="M40 560 C 220 520, 380 570, 560 520 C 680 490, 780 530, 880 500" stroke="#2d6a4f" stroke-width="3"/>
    <path d="M10 590 C 200 550, 420 610, 640 560 C 740 540, 820 570, 890 550" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M70 520 C 180 490, 290 520, 390 490 C 470 470, 530 490, 600 480" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- ========================================== -->
    <!-- 1. PERTANIAN (Padi Bertingkat & Bulir Padi) -->
    <!-- ========================================== -->
    <!-- Tangkai Bulir Padi Kiri -->
    <path d="M140 510 C 145 420, 160 330, 220 250" stroke="#c8963e" stroke-width="4"/>
    <!-- Butir Padi Kiri (Grains) -->
    <path d="M220 250 C 235 240, 250 250, 245 265 C 238 275, 225 270, 220 250 Z" fill="#c8963e" stroke="#c8963e" stroke-width="1.5"/>
    <path d="M205 270 C 220 255, 235 265, 230 280 C 220 290, 210 285, 205 270 Z" fill="#c8963e" stroke="#c8963e" stroke-width="1.5"/>
    <path d="M190 295 C 205 280, 220 290, 215 305 C 205 315, 195 310, 190 295 Z" fill="#c8963e" stroke="#c8963e" stroke-width="1.5"/>
    <path d="M178 325 C 193 310, 208 320, 203 335 C 193 345, 183 340, 178 325 Z" fill="#c8963e" stroke="#c8963e" stroke-width="1.5"/>
    <path d="M168 360 C 183 345, 198 355, 193 370 C 183 380, 173 375, 168 360 Z" fill="#c8963e" stroke="#c8963e" stroke-width="1.5"/>
    <path d="M160 400 C 175 385, 190 395, 185 410 C 175 420, 165 415, 160 400 Z" fill="#c8963e" stroke="#c8963e" stroke-width="1.5"/>

    <!-- Daun Padi Menjulang -->
    <path d="M140 480 C 110 420, 90 350, 105 280 C 112 330, 130 380, 148 420" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M145 440 C 175 390, 190 340, 180 280 C 170 330, 160 370, 148 410" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="2"/>

    <!-- Matahari Terbit di Atas Sawah -->
    <path d="M210 200 A 45 45 0 0 1 290 200" stroke="#c8963e" stroke-width="3" fill="none"/>
    <path d="M250 145 L 250 135" stroke="#c8963e" stroke-width="3"/>
    <path d="M215 160 L 208 152" stroke="#c8963e" stroke-width="3"/>
    <path d="M285 160 L 292 152" stroke="#c8963e" stroke-width="3"/>
    <path d="M195 185 L 185 185" stroke="#c8963e" stroke-width="3"/>
    <path d="M305 185 L 315 185" stroke="#c8963e" stroke-width="3"/>

    <!-- ========================================== -->
    <!-- 2. PERKEBUNAN (Pohon Kopi / Teh & Daun)    -->
    <!-- ========================================== -->
    <!-- Batang & Ranting Tanaman Perkebunan -->
    <path d="M410 510 L 410 320 C 410 280, 440 250, 470 230" stroke="#8a5a36" stroke-width="4"/>
    <path d="M410 400 C 370 380, 340 340, 330 290" stroke="#8a5a36" stroke-width="3"/>
    <path d="M410 360 C 440 340, 470 345, 490 310" stroke="#8a5a36" stroke-width="3"/>

    <!-- Daun Teh / Daun Kopi -->
    <path d="M470 230 C 500 220, 520 240, 510 260 C 490 280, 460 260, 470 230 Z" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M330 290 C 310 270, 310 240, 340 245 C 360 255, 360 285, 330 290 Z" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M490 310 C 520 300, 530 320, 520 340 C 500 355, 480 340, 490 310 Z" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M370 330 C 350 310, 360 290, 380 295 C 400 305, 395 330, 370 330 Z" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="2"/>

    <!-- Buah Kopi (Coffee Cherries Cluster) -->
    <circle cx="415" cy="355" r="7" fill="#b84d4d" stroke="#b84d4d"/>
    <circle cx="425" cy="365" r="7" fill="#c8963e" stroke="#c8963e"/>
    <circle cx="405" cy="368" r="6.5" fill="#b84d4d" stroke="#b84d4d"/>
    <circle cx="410" cy="395" r="7" fill="#b84d4d" stroke="#b84d4d"/>
    <circle cx="420" cy="402" r="6" fill="#c8963e" stroke="#c8963e"/>

    <!-- ========================================== -->
    <!-- 3. PERIKANAN (Siluet Ikan & Gelombang Air) -->
    <!-- ========================================== -->
    <!-- Siluet Ikan Melompat Indah -->
    <g transform="translate(620, 240) rotate(-15) scale(0.95)">
      <!-- Badan Ikan -->
      <path d="M 0 40 C 40 10, 90 10, 130 40 C 90 70, 40 70, 0 40 Z" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="3"/>
      <!-- Ekor Ikan -->
      <path d="M 0 40 L -35 15 C -25 35, -25 45, -35 65 Z" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="2.5"/>
      <!-- Sirip Atas & Bawah -->
      <path d="M 50 20 C 65 0, 85 5, 95 23" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="2"/>
      <path d="M 60 59 C 75 75, 90 70, 95 56" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="2"/>
      <!-- Mata & Detail Insang -->
      <circle cx="112" cy="36" r="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <path d="M 98 28 C 94 36, 94 44, 98 52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Ombak / Gelombang Air Kolam & Laut -->
    <path d="M560 380 C 585 365, 610 365, 635 380 C 660 395, 685 395, 710 380 C 735 365, 760 365, 785 380 C 810 395, 835 395, 860 380" stroke="#2b6cb0" stroke-width="3"/>
    <path d="M530 415 C 560 400, 590 400, 620 415 C 650 430, 680 430, 710 415 C 740 400, 770 400, 800 415 C 830 430, 860 430, 890 415" stroke="#2b6cb0" stroke-width="2.5"/>
    <path d="M570 450 C 600 435, 630 435, 660 450 C 690 465, 720 465, 750 450 C 780 435, 810 435, 840 450" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- ========================================== -->
    <!-- 4. PETERNAKAN (Hewan Ternak & Lumbung/Farm) -->
    <!-- ========================================== -->
    <!-- Siluet Sapi Ternak di Padang Rumput -->
    <g transform="translate(680, 430) scale(0.85)">
      <!-- Badan Sapi -->
      <path d="M 25 55 C 25 35, 50 35, 90 35 C 105 35, 115 25, 125 15 C 130 18, 135 25, 135 35 C 145 35, 150 45, 145 55 C 140 65, 130 65, 120 65 L 115 105 L 102 105 L 105 68 L 55 68 L 52 105 L 40 105 L 43 65 C 30 65, 25 60, 25 55 Z" fill="#6d4c41" stroke="#6d4c41" stroke-width="2"/>
      <!-- Tanduk & Telinga -->
      <path d="M 128 15 C 130 5, 138 5, 138 12" stroke="#6d4c41" stroke-width="2.5" fill="none"/>
      <path d="M 120 20 L 112 18" stroke="#6d4c41" stroke-width="2"/>
      <!-- Ekor -->
      <path d="M 26 45 C 20 55, 18 70, 22 80" stroke="#6d4c41" stroke-width="2" fill="none"/>
    </g>

    <!-- Siluet Gudang / Lumbung Pertanian Klasik (Barn) -->
    <g transform="translate(510, 430) scale(0.9)">
      <!-- Atap Lumbung -->
      <path d="M 10 45 L 35 15 L 75 15 L 100 45 Z" fill="#9c5b3d" stroke="#9c5b3d" stroke-width="2"/>
      <!-- Dinding Lumbung -->
      <rect x="15" y="45" width="80" height="45" fill="#f5ede0" stroke="#9c5b3d" stroke-width="2"/>
      <!-- Pintu Silang Khas Farm Barn -->
      <rect x="40" y="55" width="30" height="35" fill="#9c5b3d" opacity="0.3"/>
      <line x1="40" y1="55" x2="70" y2="90" stroke="#9c5b3d" stroke-width="1.5"/>
      <line x1="70" y1="55" x2="40" y2="90" stroke="#9c5b3d" stroke-width="1.5"/>
      <!-- Ventilasi Atap -->
      <circle cx="55" cy="30" r="6" fill="#9c5b3d" opacity="0.4"/>
    </g>

    <!-- Burung Terbang di Langit Pertanian -->
    <path d="M 320 120 Q 330 110 340 120 Q 350 110 360 120" stroke="#2d6a4f" stroke-width="2" fill="none"/>
    <path d="M 370 140 Q 378 132 386 140 Q 394 132 402 140" stroke="#2d6a4f" stroke-width="1.8" fill="none"/>
    <path d="M 450 110 Q 457 103 464 110 Q 471 103 478 110" stroke="#2d6a4f" stroke-width="1.8" fill="none"/>
  </g>
</svg>
